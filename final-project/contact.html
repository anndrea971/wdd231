<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Maipu SLP Center to schedule an appointment.">
    <meta name="author" content="Andrea Gonzalez">
    <title>Contact | Maipu SLP Center</title>
    <link rel="icon" href="images/man.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="styles/short.css">
    <link rel="stylesheet" href="styles/larger.css">
    

    <script src="scripts/main.js" defer type="module"></script>
</head>
<body>
    <header>
        <div class="logo">Maipu SLP Center</div>
      <button class="menu-btn" id="menu-btn" aria-label="Open Menu">
        <img src="images/menu.svg" alt="Open Menu" width="32" height="32">
    </button>

    <nav id="nav-bar" class="nav-bar">
        <button class="close-btn" id="close-btn" aria-label="Close Menu">
            <img src="images/cerrar.svg" alt="Close Button" width="32" height="32">
        </button>
        <nav>
            <ul id="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="milestones.html">Milestones</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="attributions.html">Attributions</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <form action="form-action.html" method="get" class="contact-form">
            <fieldset>
                <legend>Patient Information</legend>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" required>

                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
                
                <label for="concern">Area of Concern:</label>
                <select id="concern" name="concern">
                    <option value="speech">Speech Delay</option>
                    <option value="stuttering">Stuttering</option>
                    <option value="social">Social Interaction</option>
                    <option value="other">Other</option>
                </select>
            </fieldset>

            <input type="submit" value="Send Request" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Maipu SLP Center | Andrea Gonzalez</p>
        <p>Last Modified: <span id="lastModified"></span></p>
        <p><a href="attributions.html">Attributions</a></p>
    </footer>
</body>
</html>
