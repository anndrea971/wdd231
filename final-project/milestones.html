<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View developmental milestones for speech and language from birth to 5 years old.">
    <meta name="author" content="Andrea Gonzalez">
    <title>Milestones | Maipu SLP Center</title>
    <link rel="icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/main.js" defer type="module"></script>
    <script src="scripts/milestones.js" defer type="module"></script>
</head>
<body>
    <header>
        <div class="logo">Maipu SLP Center</div>
        <button id="hamburger" aria-label="Menu"></button>
        <nav>
            <ul id="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="milestones.html" class="active">Milestones</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Developmental Milestones</h1>
        <p class="intro-text">Filter by category to see specific skills.</p>
        
        <div class="controls">
            <button id="filter-all" class="filter-btn active">All</button>
            <button id="filter-speech" class="filter-btn">Speech Only</button>
            <button id="filter-social" class="filter-btn">Social Only</button>
        </div>

        <div id="milestone-container" class="grid-container">
            </div>

        <dialog id="milestone-modal">
            <div class="modal-content">
                <h2 id="modal-title"></h2>
                <p><strong>Age:</strong> <span id="modal-age"></span></p>
                <p><strong>Category:</strong> <span id="modal-category"></span></p>
                <p id="modal-desc"></p>
                <button id="close-modal">Close</button>
                <button id="save-favorite">Favorite This ★</button>
                <p id="fav-message"></p>
            </div>
        </dialog>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Maipu SLP Center | Andrea Gonzalez</p>
        <p>Last Modified: <span id="lastModified"></span></p>
        <p><a href="attributions.html">Attributions</a></p>
    </footer>
</body>
</html>
